# The container root maps to a single unprivileged host uid, so a chown() to
# the image's nginx uid (101) fails with EINVAL in the user namespace. Keep the
# workers on the mapped root; the namespace is the boundary here, not the uid.
user root;
# A worker's initgroups() is refused (setgroups=deny) inside that namespace, so
# the master cannot drop privileges for a worker at all: stay single-process.
master_process off;
worker_processes 1;
pid /tmp/nginx.pid;
# /dev/stderr is a symlink to /proc/self/fd/2; reopening it fails with EACCES
# when the host descriptor belongs to an unmapped uid (single-uid userns).
# Log to /tmp, which is world-writable inside the image.
error_log /tmp/error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/access.log;

    # The container root is mapped to an unprivileged host uid, so /var/cache
    # and /var/log are not writable. Keep runtime state under /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
