# Single-uid user namespace: chown() to the image's nginx uid (101) would fail
# with EINVAL, and a worker's initgroups() is refused (setgroups=deny), so stay
# single-process on the mapped root.
user root;
master_process off;
worker_processes 1;
pid /tmp/nginx.pid;
# Reopening /proc/self/fd/2 fails with EACCES under a single-uid userns, so log
# into the image's world-writable /tmp instead.
error_log /tmp/error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/access.log;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
