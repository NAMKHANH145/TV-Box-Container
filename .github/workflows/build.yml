name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  # Nhanh: sdk khong can root/namespace nen test duoc ngay tren runner.
  # Chay truoc job build 4 arch de PR biet ket qua trong ~40 s.
  smoke-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 (musl)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/io -w /io/build muslcc/x86_64:x86_64-linux-musl \
            sh -c 'rm -f minicontainer && gcc -static -Os -Wall -ffunction-sections -fdata-sections -Wl,--gc-sections -o minicontainer $(ls src/*.c | grep -v seccomp_strict_) && strip -s minicontainer'
          stat -c '%n %s bytes' build/minicontainer
      - name: sdk init/pack (11 check, khong can root)
        run: bash build/smoke-sdk.sh

      - name: install.sh smoke (fake local release)
        run: |
          mkdir -p /tmp/mc-rel /tmp/mc-stage
          cp build/minicontainer /tmp/mc-rel/minicontainer-linux-x86_64
          (cd /tmp/mc-rel && sha256sum minicontainer-linux-x86_64 > SHA256SUMS.txt)
          MC_BASE_URL=file:///tmp/mc-rel DESTDIR=/tmp/mc-stage PREFIX=/usr/local \
            sh install.sh --no-check
          EXPECTED=$(sed -n 's/.*MC_VERSION "\([^"]*\)".*/\1/p' build/src/common.h)
          /tmp/mc-stage/usr/local/bin/minicontainer version --json | grep -q "\"version\":\"$EXPECTED\""

  # Full integration matrix on the two supported Ubuntu releases. GitHub-hosted
  # runners already provide Docker, so run the same privileged container used
  # during development (cgroup v2 controllers are delegated inside it).
  local-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: local-test on Ubuntu ${{ matrix.ubuntu }}
        run: |
          mkdir -p /tmp/mc-out
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/repo -v /tmp/mc-out:/out \
            ubuntu:${{ matrix.ubuntu }} bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq busybox-static iproute2 iptables iputils-ping \
                procps curl ca-certificates zstd gcc make libc6-dev python3 file >/dev/null
              mkdir -p /sys/fs/cgroup/mc-host
              for p in $(cat /sys/fs/cgroup/cgroup.procs); do
                echo $p > /sys/fs/cgroup/mc-host/cgroup.procs 2>/dev/null || true
              done
              echo "+cpu +memory +pids +io" > /sys/fs/cgroup/cgroup.subtree_control
              cd /repo/build
              make clean >/dev/null
              make CC=gcc STRIP=strip >/dev/null
              bash local-test.sh 2>&1 | tee /out/test.log
            '

  # Kiem tra tren phan cung that (TV Box S905W) qua self-hosted runner. Mac dinh TAT de
  # run tren GitHub-hosted luon xanh; bat bang repo variable MC_HARDWARE_TESTS=true khi
  # runner aarch64 online va da `install -m755 minicontainer /usr/local/bin/` tren box.
  hardware-test:
    runs-on: [self-hosted, linux, aarch64]
    if: >-
      vars.MC_HARDWARE_TESTS == 'true' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4
      - name: Chay test.sh tren TV Box (full matrix)
        run: |
          export PATH=/usr/local/bin:$PATH
          command -v minicontainer || { echo "cai minicontainer vao /usr/local/bin tren runner truoc"; exit 1; }
          minicontainer --version
          bash build/test.sh

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            musl: aarch64-linux-musl
          - arch: armv7l
            musl: armv7l-linux-musleabihf
          - arch: x86_64
            musl: x86_64-linux-musl
          - arch: riscv64
            musl: riscv64-linux-musl

    steps:
      - uses: actions/checkout@v4

      # musl.cc truncates requests from GitHub runner IPs ("Actions has been
      # blocked wholesale"), so the maintainer-published Docker images are the
      # only reliable way to get gcc+musl here. musl is what keeps the assets
      # ~220-240KB: glibc static costs 620-930KB for the same code.
      # Flags mirror build/Makefile (the images ship no make, only the compiler).
      # src/seccomp_strict_*.c are generated per arch and all define the same
      # symbols, so only one may be compiled (the Makefile filters them too).
      - name: Build static binary (musl)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/io -w /io/build muslcc/x86_64:${{ matrix.musl }} \
            sh -c 'rm -f minicontainer && gcc -static -Os -Wall -ffunction-sections -fdata-sections -Wl,--gc-sections -o minicontainer $(ls src/*.c | grep -v seccomp_strict_) && strip -s minicontainer'
          stat -c '%n %s bytes' build/minicontainer

      - name: Check binary is static and not bloated
        run: |
          file build/minicontainer
          size=$(stat -c '%s' build/minicontainer)
          # A glibc-static build of this code is 600KB+; anything over 300KB
          # means the wrong libc slipped in.
          if [ "$size" -gt 300000 ]; then
            echo "minicontainer is $size bytes - expected a musl static build under 300000" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp build/minicontainer dist/minicontainer-linux-${{ matrix.arch }}
          cp build/test.sh dist/test.sh
          cp build/smoke-sdk.sh dist/smoke-sdk.sh
          chmod +x dist/minicontainer-linux-${{ matrix.arch }} dist/smoke-sdk.sh
          file dist/minicontainer-linux-${{ matrix.arch }}
          stat -c '%n %s bytes' dist/minicontainer-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minicontainer-linux-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add installer
        run: cp install.sh dist/install.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum minicontainer-linux-* test.sh smoke-sdk.sh install.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/minicontainer-linux-*
            dist/test.sh
            dist/smoke-sdk.sh
            dist/install.sh
            dist/SHA256SUMS.txt
