name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            musl: aarch64-linux-musl
          - arch: armv7l
            musl: armv7l-linux-musleabihf
          - arch: x86_64
            musl: x86_64-linux-musl
          - arch: riscv64
            musl: riscv64-linux-musl

    steps:
      - uses: actions/checkout@v4

      # musl.cc truncates requests from GitHub runner IPs ("Actions has been
      # blocked wholesale"), so the maintainer-published Docker images are the
      # only reliable way to get gcc+musl here. musl is what keeps the assets
      # ~100-130KB: glibc static costs 620-930KB for the same code.
      # Flags mirror build/Makefile (the images ship no make, only the compiler).
      - name: Build static binary (musl)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/io -w /io/build \
            muslcc/x86_64:${{ matrix.musl }} \
            sh -c 'rm -f minicontainer && gcc -static -O2 -Wall -o minicontainer src/*.c && strip -s minicontainer'
          stat -c '%n %s bytes' build/minicontainer

      - name: Check binary is static and not bloated
        run: |
          file build/minicontainer
          size=$(stat -c '%s' build/minicontainer)
          # A glibc-static build of this code is 600KB+; anything over 200KB
          # means the wrong libc slipped in.
          if [ "$size" -gt 200000 ]; then
            echo "minicontainer is $size bytes - expected a musl static build under 200000" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp build/minicontainer dist/minicontainer-linux-${{ matrix.arch }}
          cp build/test.sh dist/test.sh
          chmod +x dist/minicontainer-linux-${{ matrix.arch }}
          file dist/minicontainer-linux-${{ matrix.arch }}
          stat -c '%n %s bytes' dist/minicontainer-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minicontainer-linux-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum minicontainer-linux-* test.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/minicontainer-linux-*
            dist/test.sh
            dist/SHA256SUMS.txt
